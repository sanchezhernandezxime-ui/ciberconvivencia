<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipo 07 | Ciberconvivencia</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>🛡️ Equipo 07</h1>
<h2>Plataforma de Prevención del Ciberacoso</h2>
</header>

<!-- ================= VIOLENTÓMETRO ================= -->
<section id="violentometro">

<h2>🛡️ Violentómetro</h2>

<div class="checklist">
<label><input type="checkbox" class="riesgo" value="1"> Insultos</label>
<label><input type="checkbox" class="riesgo" value="2"> Rumores</label>
<label><input type="checkbox" class="riesgo" value="3"> Amenazas</label>
</div>

<button onclick="evaluarViolentometro()">Evaluar</button>

<div id="resultadoViolentometro"></div>

<h3>Herramientas</h3>

<button onclick="mostrarAyudaNivel('amarillo')">Amarillo</button>
<button onclick="mostrarAyudaNivel('naranja')">Naranja</button>
<button onclick="mostrarAyudaNivel('rojo')">Rojo</button>

<div id="resultadoViolento"></div>

</section>

<!-- ================= BUZÓN ================= -->
<section id="buzon">

<h2>Buzón Inteligente</h2>

<textarea id="testimonio"></textarea>

<button onclick="enviarTestimonio()">Enviar</button>

<div id="mensaje"></div>

<div id="respuestaVictima" style="display:none;">
<h2>Ayuda personalizada</h2>

<div id="nivelRiesgo"></div>
<div id="tipoCaso"></div>
<div id="explicacionCaso"></div>
<div id="accionesCaso"></div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>

</body>
</html>
