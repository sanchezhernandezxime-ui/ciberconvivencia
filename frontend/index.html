<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ciberinformación</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>🛡️ Ciberinformación</h1>
  <p>Plataforma de apoyo, prevención y orientación ante el ciberacoso</p>
</header>

<section class="card">
  <h2>⚠️ Violentómetro Digital</h2>

  <label><input type="checkbox" value="1"> Insultos o burlas</label>
  <label><input type="checkbox" value="1"> Rumores</label>
  <label><input type="checkbox" value="2"> Amenazas</label>
  <label><input type="checkbox" value="2"> Acoso constante</label>
  <label><input type="checkbox" value="3"> Difusión de información privada</label>
  <label><input type="checkbox" value="3"> Suplantación de identidad</label>

  <button onclick="evaluar()">Evaluar situación</button>

  <p id="nivel"></p>
</section>

<section class="card">
  <h2>📊 Información y apoyo personalizado</h2>
  <div id="info">Selecciona una evaluación para ver ayuda.</div>
</section>

<section class="card">
  <h2>📩 Buzón 100% Anónimo</h2>

  <textarea id="mensaje" placeholder="Describe lo que estás viviendo..."></textarea>

  <button onclick="enviar()">Enviar de forma anónima</button>

  <p id="estado"></p>
</section>

<script src="app.js"></script>
</body>
</html>
